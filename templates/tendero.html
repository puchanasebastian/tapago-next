<script>
    async function consultarPagos() {
        try {
            // 1. Ruta corregida a /api/transacciones
            const res = await fetch('/api/transacciones');
            const pagos = await res.json();

            // 2. Evaluamos directamente el array devuelto por Flask
            if (Array.isArray(pagos) && pagos.length > 0) {
                const lista = document.getElementById('lista-pagos');
                lista.innerHTML = "";

                pagos.forEach(pago => {
                    const item = document.createElement('div');
                    item.className = 'pago-card';
                    item.innerHTML = `
                        <div>
                            <div class="monto">${typeof pago.monto === 'number' ? '$' + pago.monto.toLocaleString('es-CO') + ' COP' : pago.monto}</div>
                            <div class="meta-info">Origen: ${pago.celular} • Ref: ${pago.referencia}</div>
                        </div>
                        <span class="badge-status">${pago.estado}</span>
                    `;
                    lista.appendChild(item);
                });
            }
        } catch (e) {
            console.error("Error conectando con la terminal", e);
        }
    }

    setInterval(consultarPagos, 1500);
    consultarPagos();
</script>
