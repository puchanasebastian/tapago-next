<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAPAGO POS - Dashboard Tendero</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        .top-bar {
            width: 100%;
            max-width: 600px;
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h2 { font-size: 16px; font-weight: 600; color: #ffffff; }
        .user-info p { font-size: 12px; color: #64748b; }

        .logout-btn {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .logout-btn:hover { background-color: #ef4444; color: #ffffff; }

        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .logo span { color: #10b981; }

        .status-badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

        .summary-card {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(135deg, #131b2e 0%, #1a233a 100%);
            border: 1px solid #2a365c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-info h3 { font-size: 14px; color: #8b9bb4; font-weight: 500; margin-bottom: 6px; }
        .summary-info .total-monto { font-size: 28px; font-weight: bold; color: #10b981; }
        .summary-stats { text-align: right; }
        .summary-stats .tx-count { font-size: 18px; font-weight: 600; color: #e2e8f0; }

        .btn-export {
            margin-top: 10px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #0284c7;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-export:hover { background-color: #0284c7; color: #ffffff; }

        .feed-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }

        .card {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card.aprobado { border-left: 4px solid #10b981; }
        .card.pendiente { border-left: 4px solid #f59e0b; }
        .card-details h4 { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .card-details p { font-size: 13px; color: #64748b; }

        .state-tag { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .state-tag.aprobado { background-color: rgba(16, 185, 129, 0.2); color: #10b981; }
        .state-tag.pendiente { background-color: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR CON PERFIL DEL USUARIO -->
    <div class="top-bar">
        <div class="user-info">
            <h2>👤 {{ usuario.nombre }}</h2>
            <p>Nequi: <strong>{{ usuario.nequi }}</strong> | {{ usuario.correo }}</p>
        </div>
        <a href="/logout" class="logout-btn">🚪 Cerrar Sesión</a>
    </div>

    <div class="header">
        <div class="logo">TAPA<span>GO</span> POS</div>
        <div class="status-badge">
            <div class="status-dot"></div>
            Terminal Activo
        </div>
    </div>

    <!-- TARJETA TOTALIZADORA -->
    <div class="summary-card">
        <div class="summary-info">
            <h3>Ventas de Hoy</h3>
            <div class="total-monto" id="totalMonto">$0 COP</div>
        </div>
        <div class="summary-stats">
            <div class="tx-count" id="totalTx">0 pagos</div>
            <a href="/api/exportar-excel" class="btn-export">📥 Exportar CSV/Excel</a>
        </div>
    </div>

    <!-- FEED EN TIEMPO REAL -->
    <div class="feed-container" id="feed"></div>

    <script>
        let transaccionesPrevias = [];

        async function cargarResumen() {
            try {
                const res = await fetch('/api/resumen-hoy');
                const data = await res.json();
                
                const totalFormateado = new Intl.NumberFormat('es-CO', {
                    style: 'currency', currency: 'COP', maximumFractionDigits: 0
                }).format(data.total_ventas);

                document.getElementById('totalMonto').innerText = totalFormateado;
                document.getElementById('totalTx').innerText = `${data.total_tx} pago${data.total_tx === 1 ? '' : 's'}`;
            } catch (err) {
                console.error("Error al cargar resumen:", err);
            }
        }

        async function cargarTransacciones() {
            try {
                const res = await fetch('/api/transacciones');
                const transacciones = await res.json();
                
                const feed = document.getElementById('feed');
                feed.innerHTML = '';

                transacciones.forEach(tx => {
                    const card = document.createElement('div');
                    const estadoClass = tx.estado.toLowerCase();
                    card.className = `card ${estadoClass}`;

                    const montoFormateado = typeof tx.monto === 'number'
                        ? new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(tx.monto)
                        : tx.monto;

                    card.innerHTML = `
                        <div class="card-details">
                            <h4>${montoFormateado}</h4>
                            <p>Origen: ${tx.celular} • Ref: ${tx.referencia}</p>
                        </div>
                        <div class="state-tag ${estadoClass}">${tx.estado}</div>
                    `;
                    feed.appendChild(card);
                });

                if (transacciones.length !== transaccionesPrevias.length) {
                    cargarResumen();
                    transaccionesPrevias = transacciones;
                }
            } catch (err) {
                console.error("Error al cargar transacciones:", err);
            }
        }

        cargarResumen();
        cargarTransacciones();
        setInterval(cargarTransacciones, 3000);
    </script>
</body>
</html>
