<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TAPAGO POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #121824; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        h2 span { color: #10b981; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e14; border: 1px solid #2a365c; border-radius: 8px; color: #fff; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
        .link a { color: #10b981; text-decoration: none; }
        .flash { background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>TAPA<span>GO</span> POS</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST" action="/login">
            <input type="email" name="correo" placeholder="Correo Electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <div class="link">¿No tienes cuenta? <a href="/registro">Regístrate gratis</a></div>
    </div>
</body>
</html>
