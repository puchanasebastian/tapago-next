<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TAPAGO POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #121824; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        h2 span { color: #10b981; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e14; border: 1px solid #2a365c; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #10b981; }
        button { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #059669; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; }
        .link a { color: #10b981; text-decoration: none; font-weight: 500; }
        .flash { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; text-align: center; line-height: 1.4; }
        .flash-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
        
        /* Estilos del separador y botón de Google */
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1e293b; }
        .divider span { padding: 0 10px; }
        .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #ffffff; color: #1e293b; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; transition: background 0.2s; }
        .btn-google:hover { background: #f1f5f9; }
        .btn-google img { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>TAPA<span>GO</span> POS</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {% if category == 'success' %}flash-success{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <input type="email" name="correo" placeholder="Correo Electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="divider"><span>O</span></div>

        <a href="{{ url_for('login_google') }}" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Continuar con Google
        </a>

        <div class="link">¿No tienes cuenta? <a href="/registro">Regístrate gratis</a></div>
    </div>

    <div style="margin-top: 20px; text-align: center;">
    <a href="/descargar-apk" class="btn-apk" style="background-color: #10b981; color: white; padding: 10px 18px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">
        📲 Descargar Aplicación (APK)
    </a>
</div>
</body>
</html>
